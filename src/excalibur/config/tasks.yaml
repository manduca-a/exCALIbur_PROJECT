analysis_task:
  description: >
    Analyze the following emergency call transcription:
    "{call_transcription}"
    
    From the text above, extract:
    1. Patient's current location (address, intersection, landmark, or coordinates)
    2. Medical condition/category (cardiac, trauma, stroke, respiratory, etc.)
    3. Urgency/severity level
    4. Any special requirements (mobility assistance, pediatric care, etc.)
    
    Structure the information clearly for handoff to other specialist agents.
  expected_output: >
    A structured intake assessment including:
    - Patient Location: [address or description]
    - Medical Condition Category: [type of emergency]
    - Severity Level: [critical/high/medium]
    - Special Requirements: [any specific needs]
    - Call Summary: [brief assessment]
  agent: analyzer

dispatch_task:
  description: >
    Review the patient's location identified in the previous analysis_task.
    
    Here is the live data of our currently available ambulance fleet:
    {ambulances}
    
    Use the "Google Maps Traffic ETA Calculator" tool to evaluate all these available units.
    You must format the fleet data exactly as the tool requests.
    Dispatch the ambulance with the lowest Estimated Time of Arrival (ETA).

    Then, use the tool to set the chosen ambulance's status to "occupied" for the duration of the mission, which includes:
    - Travel time to the patient (from the ETA calculation)
    - On-site service time (assume 5 minutes)
    - Hospital reaching time (assume 8 minutes)
    - Services time at the hospital (assume 2 minutes)
  expected_output: >
    A clear dispatch order stating the chosen Ambulance ID, its ETA in minutes, 
    and a brief justification based on the traffic analysis.
  agent: ambulance_dispatcher

