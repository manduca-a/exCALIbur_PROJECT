analysis_task:
  description: >
    Analyze the following emergency call transcription:
    "{call_transcription}"
    
    From the text above, extract:
    1. Patient's current location (address, intersection, landmark, or coordinates)
    2. Medical condition/category (cardiac, trauma, stroke, respiratory, etc.)
    
    Structure the information clearly for handoff to other specialist agents.
  expected_output: >
    A structured intake assessment including:
    - Patient Location: [address or description]
    - Medical Condition Category: [type of emergency]
    - Call Summary: [very brief assessment]
  agent: analyzer

dispatch_task:
  description: >
    MANDATORY SEQUENCE:
    1. Call Google Maps Traffic ETA Calculator FIRST using the patient's location identified in the previous analysis_task. Wait for the result.
    2. ONLY AFTER reading the ETA result, identify the ambulance with the lowest ETA.
    3. THEN call assign_ambulance with that ambulance ID and its ETA duration to mark it as occupied.
    Do NOT call assign_ambulance before receiving ETA results.
  expected_output: >
    A structured dispatch report including:
    - Dispatched Ambulance ID: [ID]
    - Estimated Time of Arrival: [ETA in minutes]
  agent: ambulance_dispatcher

hospital_locator_task:
  description: >
    Your task is to identify the best hospital for the patient and secure a bed.

    1. EXECUTE TOOL: Call "Hospital Locator Tool" with these parameters:
       - patient_address: (extract from previous analysis_task)
       - required_specialty: (category identified in previous analysis_task)
       *This tool will load hospital states and perform the Google Maps distance matrix calculation.*

    2. ANALYZE RESULTS: Wait for the tool's output. Identify the hospital with the best ETA, capacity, and specialty match.

    3. RESERVE BED: Call "reserve_hospital_bed" using the exact name of the selected hospital.

    4. OCCUPY AMBULANCE: Retrieve the "Dispatched Ambulance ID" from the dispatch_task output and call "occupy_ambulance_for_hospital" with:
       - ambulance_id: (integer)
       - duration_minutes: (ETA in minutes from the locator tool's report)
       - selected_hospital_id: (integer, found in the locator tool's output)

    CRITICAL: Do not attempt to use any search tools. Rely strictly on the output provided by the "Hospital Locator Tool".

  expected_output: >
    A structured assignment report:
    - Selected Hospital Name: [name]
    - Selected Hospital ID: [ID]
    - Address: [address]
    - Coordinates: [lat, long]
    - Available Beds: [number before reservation]
    - Matching Specialization: [specialty]
    - Estimated Travel Time: [ETA]
    - Bed Reserved: yes
    - Justification: [brief reasoning based on ETA and specialty]
  agent: hospital_locator

rehabilitation_task:
  description: >
    Based on the complete emergency case information gathered in the previous tasks,
    develop a comprehensive post-treatment rehabilitation plan for the patient.

    Use the following context from prior agents:
    - Patient intake assessment (location, medical category, severity level, 
      special requirements) from the analysis_task
    - Dispatched ambulance ID and ETA from the dispatch_task, which gives you
      an estimate of time-to-care and transport conditions

    Your rehabilitation plan must include:

    1. POST-HOSPITALIZATION CLINICAL SUMMARY
       - Assumed stabilization status based on emergency category
       - Expected immediate medical interventions upon arrival

    2. REHABILITATION PATHWAY (phased approach)
       Phase 1 — Acute care (0–72h): bed rest protocols, monitoring parameters,
                  contraindications, early mobilization if applicable
       Phase 2 — Subacute (day 3 to 2 weeks): physiotherapy initiation,
                  occupational therapy if needed, pain management plan
       Phase 3 — Outpatient recovery (week 2 onwards): home exercise program,
                  specialist follow-up schedule, dietary recommendations

    3. THERAPY AND MEDICATIONS
       - Suggested drug classes (do NOT specify exact dosages — flag for prescribing physician)
       - Physical therapy modalities (e.g. respiratory physiotherapy for pulmonary cases)
       - Psychological support if trauma or high-stress emergency

    4. RECOVERY TIMELINE ESTIMATE
       - Expected full recovery duration based on severity level
       - Key milestones and criteria for phase progression

    5. RELAPSE PREVENTION AND FOLLOW-UP
       - Risk factors to monitor
       - Emergency warning signs for the patient and caregivers
       - Scheduled follow-up touchpoints

    Adapt all recommendations to the specific medical category identified.
    For CRITICAL severity: be conservative, flag all decisions for physician review.
    For HIGH severity: provide a complete plan with clinical justifications.
    For MEDIUM severity: focus on outpatient recovery and lifestyle guidance.
  expected_output: >
    A brief and structured rehabilitation report in Markdown format containing all five
    sections listed above. The report must be:
    - Clinically grounded and coherent with the emergency type
    - Clearly labeled with section headers
    - Free of specific drug dosages (flag for physician)
    - Realistic in timeline estimates based on the severity level
    - Professional in tone but accessible to care coordinators
  agent: rehabilitation_specialist