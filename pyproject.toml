[project]
name = "excalibur"
version = "0.1.0"
description = "exCALIbur using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5",
    "googlemaps>=4.10.0",
    "litellm>=1.84.0",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
excalibur = "excalibur.main:run"
run_crew = "excalibur.main:run"
train = "excalibur.main:train"
replay = "excalibur.main:replay"
test = "excalibur.main:test"
run_with_trigger = "excalibur.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
